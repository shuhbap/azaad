<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>💫 Premium Wedding | Abdul Kalam & Majidha</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <style>
    /* ----- RESET ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* ============================================
       PREMIUM LUXURY BACKGROUND
    ============================================ */
    .luxury-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(ellipse at 30% 20%, #1a1a1a 0%, #0a0a0a 60%, #000000 100%);
    }

    /* Glowing gold orb */
    .gold-orb {
      position: absolute;
      top: -20%;
      right: -10%;
      width: 80vmax;
      height: 80vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.06) 0%, transparent 70%);
      animation: pulseOrb 8s ease-in-out infinite;
    }

    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    .gold-orb-2 {
      position: absolute;
      bottom: -20%;
      left: -10%;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 168, 76, 0.04) 0%, transparent 70%);
      animation: pulseOrb 12s ease-in-out infinite reverse;
    }

    /* Premium geometric pattern */
    .premium-pattern {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 160vmax;
      height: 160vmax;
      transform: translate(-50%, -50%);
      animation: rotatePremium 120s linear infinite;
      opacity: 0.04;
    }

    @keyframes rotatePremium {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .premium-pattern-2 {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vmax;
      height: 100vmax;
      transform: translate(-50%, -50%);
      animation: rotatePremium2 160s linear infinite reverse;
      opacity: 0.025;
    }

    @keyframes rotatePremium2 {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Floating gold particles */
    .gold-particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #c9a84c;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(201, 168, 76, 0.3);
      animation: floatGold 15s ease-in-out infinite alternate;
    }

    .gold-particle:nth-child(1) { top: 10%; left: 8%; animation-duration: 18s; width: 6px; height: 6px; }
    .gold-particle:nth-child(2) { top: 85%; left: 92%; animation-duration: 22s; }
    .gold-particle:nth-child(3) { top: 70%; left: 4%; animation-duration: 25s; width: 8px; height: 8px; opacity: 0.6; }
    .gold-particle:nth-child(4) { top: 12%; left: 88%; animation-duration: 20s; width: 10px; height: 10px; opacity: 0.4; }
    .gold-particle:nth-child(5) { top: 50%; left: 50%; animation-duration: 28s; width: 12px; height: 12px; opacity: 0.3; }
    .gold-particle:nth-child(6) { top: 30%; left: 25%; animation-duration: 16s; }
    .gold-particle:nth-child(7) { top: 75%; left: 75%; animation-duration: 24s; width: 6px; height: 6px; }
    .gold-particle:nth-child(8) { top: 45%; left: 12%; animation-duration: 19s; width: 5px; height: 5px; }
    .gold-particle:nth-child(9) { top: 20%; left: 60%; animation-duration: 21s; width: 7px; height: 7px; }
    .gold-particle:nth-child(10) { top: 60%; left: 35%; animation-duration: 26s; width: 4px; height: 4px; }

    @keyframes floatGold {
      0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      33% { transform: translate(40px, -60px) scale(1.5); opacity: 0.8; }
      66% { transform: translate(-30px, 40px) scale(0.7); opacity: 0.4; }
      100% { transform: translate(20px, -20px) scale(1.2); opacity: 0.6; }
    }

    /* Shimmer overlay */
    .shimmer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 40%,
        rgba(201, 168, 76, 0.02) 45%,
        rgba(201, 168, 76, 0.05) 50%,
        rgba(201, 168, 76, 0.02) 55%,
        transparent 60%
      );
      animation: shimmer 8s ease-in-out infinite;
      transform: translateX(-50%);
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ============================================
       PREMIUM INVITATION CARD
    ============================================ */
    .invitation-card {
      position: relative;
      z-index: 1;
      max-width: 820px;
      width: 100%;
      background: linear-gradient(160deg, #1a1a1a 0%, #0f0f0f 50%, #1a1a1a 100%);
      border-radius: 32px;
      padding: 28px 20px;
      box-shadow: 
        0 40px 80px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(201, 168, 76, 0.08),
        inset 0 1px 0 rgba(201, 168, 76, 0.05);
      border: 1px solid rgba(201, 168, 76, 0.1);
      transition: all 0.3s ease;
    }

    @media (min-width: 600px) {
      .invitation-card {
        padding: 44px 40px;
        border-radius: 48px;
      }
    }

    @media (min-width: 1024px) {
      .invitation-card {
        padding: 56px 52px;
        border-radius: 56px;
      }
    }

    /* ----- PREMIUM BORDER DECORATIONS ----- */
    .premium-border-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .premium-border-top .line {
      flex: 1;
      max-width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      opacity: 0.4;
    }

    .premium-border-top .diamond {
      color: #c9a84c;
      font-size: 1.2rem;
      opacity: 0.6;
    }

    .premium-border-bottom {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .premium-border-bottom .line {
      flex: 1;
      max-width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      opacity: 0.4;
    }

    .premium-border-bottom .diamond {
      color: #c9a84c;
      font-size: 1.2rem;
      opacity: 0.6;
    }

    /* Gold divider */
    .divider-gold-premium {
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      margin: 12px auto;
      opacity: 0.4;
    }

    .divider-gold-premium-thick {
      width: 180px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #c9a84c, transparent);
      margin: 16px auto;
      border-radius: 4px;
      opacity: 0.5;
    }

    /* ----- TYPOGRAPHY (Premium) ----- */
    .bismillah-premium {
      font-family: 'Amiri', serif;
      font-size: 1.6rem;
      text-align: center;
      color: #c9a84c;
      margin: 4px 0 2px;
      font-weight: 700;
      opacity: 0.8;
      text-shadow: 0 0 40px rgba(201, 168, 76, 0.1);
    }

    .arabic-title-premium {
      font-family: 'Amiri', serif;
      font-size: 2rem;
      text-align: center;
      color: #f5efe4;
      font-weight: 700;
      line-height: 1.3;
      margin-top: 4px;
      text-shadow: 0 0 60px rgba(201, 168, 76, 0.05);
    }

    .english-title-premium {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      text-align: center;
      color: #f5efe4;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 2px;
      text-shadow: 0 0 60px rgba(201, 168, 76, 0.05);
    }

    .subhead-arabic-premium {
      font-family: 'Amiri', serif;
      font-style: italic;
      font-size: 0.95rem;
      text-align: center;
      color: #a09080;
      margin-top: 4px;
    }

    .subhead-english-premium {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      text-align: center;
      color: #8a7a6a;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .couple-names-arabic-premium {
      font-family: 'Amiri', serif;
      font-size: 2rem;
      text-align: center;
      color: #f5efe4;
      font-weight: 700;
      line-height: 1.4;
      margin: 8px 0;
      text-shadow: 0 0 60px rgba(201, 168, 76, 0.05);
    }

    .couple-names-english-premium {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      text-align: center;
      color: #f5efe4;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.5px;
    }

    .gold-amp {
      color: #c9a84c;
      font-size: 1.3rem;
      opacity: 0.7;
    }

    /* ----- INFO GRID (Premium) ----- */
    .info-grid-premium {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0 16px;
    }

    @media (max-width: 500px) {
      .info-grid-premium {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }

    .info-card-premium {
      background: rgba(201, 168, 76, 0.03);
      border-radius: 16px;
      padding: 12px 14px;
      border: 1px solid rgba(201, 168, 76, 0.06);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .info-card-premium:hover {
      background: rgba(201, 168, 76, 0.05);
      border-color: rgba(201, 168, 76, 0.12);
    }

    .info-label-premium {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #c9a84c;
      font-weight: 600;
      opacity: 0.7;
    }

    .info-value-premium {
      font-size: 0.9rem;
      color: #d0c8c0;
      line-height: 1.5;
      margin-top: 2px;
    }

    .info-value-premium strong {
      color: #f5efe4;
      font-weight: 600;
    }

    .info-value-premium .sub {
      font-size: 0.75rem;
      color: #8a7a6a;
    }

    /* ----- DATE (Premium) ----- */
    .date-premium {
      background: rgba(201, 168, 76, 0.03);
      border-radius: 16px;
      padding: 12px 14px;
      margin: 6px 0 10px;
      border: 1px solid rgba(201, 168, 76, 0.06);
      text-align: center;
    }

    .date-premium .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 16px;
      font-size: 0.9rem;
      color: #d0c8c0;
    }

    .date-premium .row span {
      font-weight: 600;
      color: #c9a84c;
    }

    /* ----- VENUE (Premium) ----- */
    .venue-premium {
      background: linear-gradient(135deg, rgba(201, 168, 76, 0.03), rgba(201, 168, 76, 0.01));
      border-radius: 20px;
      padding: 16px 18px;
      margin: 14px 0 18px;
      border-left: 3px solid #c9a84c;
      border-right: 1px solid rgba(201, 168, 76, 0.05);
    }

    .venue-name-premium {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #f5efe4;
    }

    .venue-address-premium {
      font-size: 0.9rem;
      color: #a09080;
      margin: 4px 0 6px;
      line-height: 1.5;
    }

    .venue-contact-premium {
      font-size: 0.85rem;
      color: #8a7a6a;
      margin-bottom: 6px;
    }

    .map-button-premium {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 500;
      color: #f5efe4;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid rgba(201, 168, 76, 0.15);
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .map-button-premium:hover {
      background: linear-gradient(135deg, #2a2a2a, #3a3a3a);
      border-color: rgba(201, 168, 76, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(201, 168, 76, 0.1);
    }

    /* ----- POSTER (Premium) ----- */
    .poster-premium {
      margin: 16px 0 14px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(201, 168, 76, 0.08);
    }
    .poster-premium img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ----- REEL (Premium) ----- */
    .reel-premium {
      margin: 14px 0 18px;
      border-radius: 20px;
      overflow: hidden;
      background: #0a0a0a;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(201, 168, 76, 0.06);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
    }
    .reel-premium video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .reel-premium .fallback {
      color: #8a7a6a;
      font-family: 'Amiri', serif;
      font-size: 1rem;
      padding: 20px;
      text-align: center;
    }

    /* ----- COUNTDOWN (Premium) ----- */
    .countdown-premium {
      background: rgba(201, 168, 76, 0.02);
      border-radius: 20px;
      padding: 20px 14px;
      margin: 14px 0 18px;
      text-align: center;
      border: 1px solid rgba(201, 168, 76, 0.04);
      backdrop-filter: blur(10px);
    }

    .countdown-title-premium {
      font-family: 'Amiri', serif;
      font-size: 1.1rem;
      color: #c9a84c;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .countdown-grid-premium {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 14px;
    }

    .countdown-item-premium {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 16px;
      padding: 8px 14px;
      min-width: 56px;
      border: 1px solid rgba(201, 168, 76, 0.04);
      backdrop-filter: blur(10px);
    }

    .countdown-number-premium {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: 'Amiri', serif;
      color: #f5efe4;
      line-height: 1.2;
      text-shadow: 0 0 40px rgba(201, 168, 76, 0.05);
    }

    .countdown-label-premium {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8a7a6a;
      font-weight: 500;
    }

    /* ----- RSVP (Premium) ----- */
    .rsvp-premium {
      margin: 18px 0 14px;
      background: rgba(201, 168, 76, 0.02);
      border-radius: 20px;
      padding: 20px 16px;
      border: 1px solid rgba(201, 168, 76, 0.04);
    }

    .rsvp-title-premium {
      font-family: 'Amiri', serif;
      font-size: 1.5rem;
      text-align: center;
      color: #f5efe4;
      font-weight: 700;
    }

    .rsvp-sub-premium {
      text-align: center;
      color: #8a7a6a;
      font-size: 0.85rem;
      margin-bottom: 16px;
      font-style: italic;
    }

    .rsvp-form-premium {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group-premium {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .form-group-premium label {
      font-weight: 500;
      font-size: 0.8rem;
      color: #a09080;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
    }

    .form-group-premium input,
    .form-group-premium select {
      padding: 10px 16px;
      border-radius: 40px;
      border: 1px solid rgba(201, 168, 76, 0.08);
      background: rgba(255, 255, 255, 0.02);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: #f5efe4;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .form-group-premium input::placeholder {
      color: #5a4a3a;
    }

    .form-group-premium input:focus,
    .form-group-premium select:focus {
      outline: none;
      border-color: rgba(201, 168, 76, 0.2);
      background: rgba(201, 168, 76, 0.02);
      box-shadow: 0 0 30px rgba(201, 168, 76, 0.03);
    }

    .form-group-premium select option {
      background: #1a1a1a;
      color: #f5efe4;
    }

    .form-row-premium {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .form-row-premium .form-group-premium {
      flex: 1 1 140px;
    }

    .rsvp-submit-premium {
      background: linear-gradient(135deg, #c9a84c, #a8883a);
      border: none;
      padding: 14px 28px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      color: #0a0a0a;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 4px;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 30px rgba(201, 168, 76, 0.1);
    }

    .rsvp-submit-premium:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(201, 168, 76, 0.2);
      background: linear-gradient(135deg, #d4b85a, #b89842);
    }

    .rsvp-note-premium {
      font-size: 0.65rem;
      color: #5a4a3a;
      text-align: center;
      margin-top: 4px;
    }

    /* ----- SHARE (Premium) ----- */
    .share-premium {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 18px 0 6px;
    }

    .share-btn-premium {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(201, 168, 76, 0.02);
      padding: 8px 20px;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 500;
      color: #a09080;
      font-size: 0.85rem;
      border: 1px solid rgba(201, 168, 76, 0.04);
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .share-btn-premium:hover {
      background: rgba(201, 168, 76, 0.04);
      border-color: rgba(201, 168, 76, 0.08);
      color: #f5efe4;
    }

    .share-btn-premium.whatsapp {
      background: rgba(37, 211, 102, 0.1);
      color: #25D366;
      border-color: rgba(37, 211, 102, 0.1);
    }

    .share-btn-premium.whatsapp:hover {
      background: rgba(37, 211, 102, 0.15);
      border-color: rgba(37, 211, 102, 0.2);
    }

    /* ----- FOOTER (Premium) ----- */
    .footer-premium {
      text-align: center;
      font-size: 0.7rem;
      color: #4a3a2a;
      margin-top: 20px;
      border-top: 1px solid rgba(201, 168, 76, 0.04);
      padding-top: 16px;
      font-family: 'Amiri', serif;
      letter-spacing: 0.5px;
    }

    .footer-premium .arabic {
      font-size: 0.9rem;
      color: #6a5a4a;
      display: block;
      margin-bottom: 4px;
    }

    /* ============================================
       RESPONSIVE - ALL SCREENS
    ============================================ */

    /* Small phones */
    @media (max-width: 380px) {
      .invitation-card { padding: 16px 12px; border-radius: 20px; }
      body { padding: 10px 8px 30px; }
      .arabic-title-premium { font-size: 1.4rem; }
      .english-title-premium { font-size: 1.2rem; }
      .couple-names-arabic-premium { font-size: 1.4rem; }
      .couple-names-english-premium { font-size: 1.1rem; }
      .countdown-number-premium { font-size: 1.3rem; }
      .countdown-item-premium { min-width: 44px; padding: 6px 10px; }
      .info-value-premium { font-size: 0.8rem; }
      .bismillah-premium { font-size: 1.2rem; }
      .premium-border-top .diamond { font-size: 0.8rem; }
      .premium-border-top .line { max-width: 30px; }
    }

    /* Medium phones to tablets */
    @media (min-width: 381px) and (max-width: 599px) {
      .invitation-card { padding: 24px 16px; border-radius: 24px; }
      .arabic-title-premium { font-size: 1.6rem; }
      .english-title-premium { font-size: 1.3rem; }
      .couple-names-arabic-premium { font-size: 1.6rem; }
      .couple-names-english-premium { font-size: 1.2rem; }
      .countdown-number-premium { font-size: 1.5rem; }
      .countdown-item-premium { min-width: 48px; padding: 6px 12px; }
    }

    /* Tablets and small desktops */
    @media (min-width: 600px) and (max-width: 1023px) {
      .invitation-card { padding: 36px 32px; border-radius: 40px; }
